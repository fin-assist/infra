# FIN-149: install this optional drop-in only for the synthetic stage provider.
# Keep the base assistant.service: ENV=stage, AUTH_MODE=verify, real service/user JWT.
# The env file must not repeat any Environment= setting of either file.
# Keep the base unit's optional real-model block commented out.
# PEER_USER_ADDR, PEER_BANK_STATEMENT_DATA_ADDR and PEER_ANALYTICS_ADDR stay in env.
[Unit]
Requires=fake-llm.service
After=fake-llm.service

[Service]
Environment=ASSISTANT_MODEL_URI=gpt://local/aliceai-llm-flash
Environment=ASSISTANT_MODEL_FOLDER_ID=local
Environment=ASSISTANT_MODEL_ENDPOINT=http://127.0.0.1:8092/v1/responses
LoadCredential=fake-model-key:/etc/finassist/assistant/fake-model-key
Environment=ASSISTANT_MODEL_API_KEY_FILE=%d/fake-model-key
