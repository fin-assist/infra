# Requires nginx >=1.24 with http_v2; installed in the http context.
server {
    listen 80;
    server_name stage.example.invalid;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://stage.example.invalid$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name stage.example.invalid;
    ssl_certificate /etc/letsencrypt/live/stage.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 64k;
    client_body_timeout 60s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # This nginx is the public edge. Discard any client-supplied forwarding chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_next_upstream off;

    location = /v1/auth/phone/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 370s;
        proxy_send_timeout 370s;
        proxy_pass http://127.0.0.1:8080;
    }
    location ~ ^/v1/statements/[^/]+/progress$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 250s;
        proxy_send_timeout 250s;
        proxy_pass http://127.0.0.1:8080;
    }
    location ~ ^/v1/assistant/messages/[^/]+/events$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 250s;
        proxy_send_timeout 250s;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /v1/statements {
        # 10 MiB file plus the BFF's independent 64 KiB multipart envelope.
        client_max_body_size 10551296;
        proxy_request_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_pass http://127.0.0.1:8080;
    }
    location /v1/ { proxy_pass http://127.0.0.1:8080; }
    # Fake phone does not need a provider callback listener or public webhook.
    location / { return 404; }
}
